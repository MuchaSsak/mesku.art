<!doctype html>
<html lang="pl">
  <head>
    <!-- site:head -->
    <script type="module" src="/src/pages/gallery.ts"></script>
  </head>
  <body>
    <!-- site:nav -->

    <!-- Gallery section -->
    <main
      id="main"
      class="min-h-[calc(100vh-var(--spacing)*20-var(--spacing)*24)] px-side py-16"
    >
      <h1
        id="gallery-heading"
        data-split-chars
        class="md:text-6xl max-md:text-5xl [clip-path:polygon(0_0,100%_0,100%_100%,0%_100%);] text-neutral-50 font-extrabold md:py-12 max-md:py-8"
      >
        Moje prace
      </h1>

      <ul id="gallery" class="columns-sm gap-4" aria-label="Galeria prac">
        <!-- site:gallery -->
      </ul>
    </main>

    <!-- Art piece preview, filled in by `src/pages/gallery.ts` -->
    <dialog
      id="artwork-dialog"
      aria-labelledby="artwork-dialog-title"
      class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-50 max-md:w-[95%] md:w-[85%] lg:w-[70%] 2xl:w-[60%] max-sm:h-fit sm:h-3/4 bg-black/25 backdrop-blur-md rounded-xl shadow-2xl border border-neutral-50/50 backdrop:bg-black/40 backdrop:fixed backdrop:z-40 backdrop:left-0 backdrop:top-0 backdrop:w-screen backdrop:h-screen text-neutral-50"
    >
      <div
        class="relative h-full overflow-x-hidden md:p-12 sm:p-6 max-sm:px-2.5 max-sm:py-6"
        data-dialog-content
      >
        <h2 id="artwork-dialog-title" class="sr-only"></h2>

        <button
          type="button"
          data-dialog-close
          class="absolute z-[60] right-2.5 top-4 hover:scale-110 focus-visible:scale-110 transition-[scale] duration-100 origin-center p-1.5"
          aria-label="Zamknij podgląd"
          autofocus
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

        <div data-dialog-carousel class="h-full"></div>
      </div>
    </dialog>

    <!-- site:footer -->
  </body>
</html>
